[project]
name = "newscore"
version = "0.1.0"
description = "NewsCore AI — Step 0 CLI core"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "torch>=2.7,<3",  # direct dep чтобы [tool.uv.sources] перенаправил на CPU index
    "sentence-transformers>=3.0",
    "structlog>=24.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "rank-bm25>=0.2.2",
    "pymorphy3>=2.0.4",
    "numpy>=1.26",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.47.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.29",
    "razdel>=0.5.0",
]

[project.scripts]
newscore = "newscore.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/newscore"]

[tool.hatch.build.targets.wheel.sources]
"backend/src/newscore" = "newscore"

# CPU-only torch wheels — sentence-transformers тянет torch, который по
# умолчанию приходит с CUDA wheels (~7 GB, рвёт uv sync на серверах без GPU).
# На Linux/Windows используем CPU-индекс PyTorch; на macOS — обычный PyPI,
# там CPU/MPS wheels для arm64.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Torch source override: на Linux/Win берём CPU-only wheel с PyTorch index
# (без CUDA, ~150 MB вместо ~7 GB). На macOS — обычный PyPI (там arm64-wheel
# для MPS уже CPU-only по факту).
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "qual: qualitative evaluation, slow, requires real model and network",
    "slow: tests requiring real embedding model or network",
    "e2e: browser-driven end-to-end tests (Playwright + live uvicorn)",
]
addopts = "-m 'not qual and not slow and not e2e'"
