[project]
name = "newscore"
version = "0.1.0"
description = "NewsCore AI — Step 0 CLI core"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "sentence-transformers>=3.0",
    "structlog>=24.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "rank-bm25>=0.2.2",
    "pymorphy3>=2.0.4",
    "numpy>=1.26",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.47.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.29",
    "razdel>=0.5.0",
]

[project.scripts]
newscore = "newscore.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/newscore"]

[tool.hatch.build.targets.wheel.sources]
"backend/src/newscore" = "newscore"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "qual: qualitative evaluation, slow, requires real model and network",
    "slow: tests requiring real embedding model or network",
    "e2e: browser-driven end-to-end tests (Playwright + live uvicorn)",
]
addopts = "-m 'not qual and not slow and not e2e'"
