[project]
name = "newscore"
version = "0.1.0"
description = "NewsCore AI — Step 0 CLI core"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "sentence-transformers>=3.0",
    "structlog>=24.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "rank-bm25>=0.2.2",
    "pymorphy3>=2.0.4",
    "numpy>=1.26",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.47.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.29",
    "razdel>=0.5.0",
]

[project.scripts]
newscore = "newscore.cli:main"

[project.optional-dependencies]
# Выбор backend для torch — conflicting extras (uv pattern):
#   uv sync --extra cpu     # CPU-only wheels (~150 MB) — для VPS без GPU
#   uv sync --extra cu128   # CUDA 12.8 wheels — для GPU-серверов
# На macOS extras не нужны — PyPI arm64-wheel сам CPU+MPS.
cpu = ["torch>=2.7,<3"]
cu128 = ["torch>=2.7,<3"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/newscore"]

[tool.hatch.build.targets.wheel.sources]
"backend/src/newscore" = "newscore"

# Conflicting extras для CPU/CUDA — uv pattern из официального гайда
# (https://docs.astral.sh/uv/guides/integration/pytorch/).
[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu128" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# На Linux/Win: source выбирается по extras (cpu / cu128).
# На macOS: extras source игнорируется → PyPI arm64 wheel (CPU+MPS).
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "qual: qualitative evaluation, slow, requires real model and network",
    "slow: tests requiring real embedding model or network",
    "e2e: browser-driven end-to-end tests (Playwright + live uvicorn)",
]
addopts = "-m 'not qual and not slow and not e2e'"
