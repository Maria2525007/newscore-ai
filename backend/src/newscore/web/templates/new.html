{% extends "base.html" %}
{% block title %}Новая тема — Новостной агент{% endblock %}
{% block content %}

<div class="page-title">Новая тема</div>

<div class="form-wrap">
  <form action="/themes" method="post">

    <div class="form-group">
      <label class="form-label" for="query">
        Запрос
        <span class="form-hint">Тема, событие или персона — за чем следить</span>
      </label>
      <input class="form-input" type="text" id="query" name="query"
             required maxlength="500" autofocus
             placeholder="например: курс валют, ставка ЦБ, санкции…">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="period">
          Период обновления
          <span class="form-hint">30m · 1h · 2h · 1d</span>
        </label>
        <input class="form-input" type="text" id="period" name="period"
               value="1h" placeholder="1h">
      </div>
      <div class="form-group">
        <label class="form-label" for="matcher">Матчер</label>
        <select class="form-select" id="matcher" name="matcher">
          <option value="embedding" selected>Умный поиск (рекомендуется)</option>
          <option value="bm25">Поиск по словам</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="top_n">
          Top-N
          <span class="form-hint">Кол-во статей</span>
        </label>
        <input class="form-input" type="number" id="top_n" name="top_n"
               value="10" min="1" max="50">
      </div>
      <div class="form-group">
        <label class="form-label" for="days">
          Свежесть, дней
        </label>
        <input class="form-input" type="number" id="days" name="days"
               value="7" min="1" max="30">
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Создать тему</button>
      <a href="/" class="btn">Отмена</a>
    </div>

  </form>
</div>

{% endblock %}
