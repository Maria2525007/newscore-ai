{% extends "base.html" %}
{% block title %}Новая тема — NewsCore AI{% endblock %}
{% block content %}
<h1>Новая тема</h1>
<form action="/themes" method="post" class="theme-form">
  <label>
    Запрос
    <input type="text" name="query" required maxlength="500"
           placeholder="например: курс валют, ставка ЦБ, санкции…">
  </label>
  <label>
    Период обновления
    <input type="text" name="period" value="1h" placeholder="30m | 1h | 2h | 1d">
    <small>минимум 60 секунд</small>
  </label>
  <label>
    Матчер
    <select name="matcher">
      <option value="embedding" selected>embedding (multilingual-e5-base)</option>
      <option value="bm25">bm25 (baseline)</option>
    </select>
  </label>
  <label>
    Top-N
    <input type="number" name="top_n" value="10" min="1" max="50">
  </label>
  <label>
    Свежесть, дней
    <input type="number" name="days" value="7" min="1" max="30">
  </label>
  <button type="submit">Создать</button>
</form>
{% endblock %}
